name: Build iOS IPA

# 在 GitHub 的免费 macOS 机器上编译出未签名的 ipa。
# 下载后在你自己的 Windows 电脑上用 Sideloadly 签名安装。
#
# 触发方式：
#   1. 手动点 "Run workflow"
#   2. 或者 push 到 main 分支时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NovelReader/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          echo "当前可用 Xcode："
          ls /Applications | grep -i xcode || true
          # 用 16.2：稳定、对 SwiftData / Observation 支持完整
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          echo "--- 已安装的 SDK ---"
          xcodebuild -showsdks || true

      - name: 确保 iOS 平台已安装
        run: |
          set -euo pipefail

          # GitHub 的 macos runner 有时只装了 iOS SDK 头文件，
          # 但没装完整平台包，导致 "iOS 18.2 is not installed"。
          # 这里先检查，缺了就下载安装。
          echo "--- 检查 iOS 平台 ---"
          if xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "iOS SDK 路径: $(xcrun --sdk iphoneos --show-sdk-path)"
          else
            echo "iOS SDK 不可用"
          fi

          echo "--- 检查 platform ---"
          xcodebuild -showsdks | grep -i "iphoneos" || echo "无 iphoneos SDK"

          # 尝试列出已安装的平台
          echo "--- 已安装平台 ---"
          ls /Applications/Xcode_16.2.app/Contents/Developer/Platforms/ 2>/dev/null || true

          # 检查是否有 iPhoneOS.platform 的 SDK
          SDK_DIR="/Applications/Xcode_16.2.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
          if [ -d "$SDK_DIR" ]; then
            echo "SDK 目录内容："
            ls "$SDK_DIR" || true
          else
            echo "::warning::没有找到 iPhoneOS SDK 目录，尝试下载平台"
          fi

          # 如果平台真的缺失，用 xcodebuild 的 -downloadPlatform 拉取
          # 这一步可能需要几分钟，但只在缺失时执行
          if ! ls "$SDK_DIR"/iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "开始下载 iOS 平台（可能需要几分钟）..."
            xcodebuild -downloadPlatform iOS || {
              echo "::warning::-downloadPlatform 失败，尝试 xcodebuild -runFirstLaunch"
              sudo xcodebuild -runFirstLaunch || true
            }
          else
            echo "iOS SDK 已存在，跳过下载"
          fi

          echo "--- 最终检查 ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 显示工程信息
        run: |
          # 仓库根目录就是工程目录（NovelReader.xcodeproj 与 NovelReader/ 源码目录同级）
          xcodebuild -project NovelReader.xcodeproj -list

      - name: 编译（不签名）
        run: |
          set -euo pipefail

          # ── 关键设置说明 ──
          #
          # CODE_SIGNING_ALLOWED=NO
          #   跳过所有签名，产出未签名 .app，后面用 Sideloadly 在 Windows 上重签。
          #
          # ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES
          #   GitHub Actions 的 macos runner 没装 iOS 模拟器运行时，
          #   Xcode 16.2+ 的 actool 编译 asset catalog 时会去找它来渲染图标，
          #   找不到就报 "No simulator runtime version ... available"。
          #   这个开关跳过 App Store 相关渲染步骤。
          #
          # 不使用 -destination 'generic/platform=iOS'
          #   runner 上 iOS 平台包可能不完整，-destination 会要求匹配设备/平台，
          #   直接报 "iOS 18.2 is not installed"。
          #   只用 -sdk iphoneos 就能走 SDK 编译路径，不依赖平台包完整性。
          xcodebuild build \
            -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            -quiet

          echo "编译成功"

      - name: 定位产物
        id: find_app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
                     -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到编译产物 .app"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" -type d || true
            exit 1
          fi
          echo "找到产物：$APP_PATH"
          echo "--- 内容 ---"
          ls -la "$APP_PATH" | head -30
          echo "--- 可执行文件架构 ---"
          file "$APP_PATH"/NovelReader 2>/dev/null || true
          lipo -info "$APP_PATH"/NovelReader 2>/dev/null || true
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$(basename "$APP_PATH" .app)" >> "$GITHUB_OUTPUT"

      - name: 打包成 ipa
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          APP_NAME="${{ steps.find_app.outputs.app_name }}"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          # 清掉可能残留的签名信息（Sideloadly 会重新签）
          rm -rf "$RUNNER_TEMP/ipa/Payload/$APP_NAME.app/_CodeSignature" || true

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/${APP_NAME}.ipa" Payload

          echo "ipa 大小："
          ls -lh "$RUNNER_TEMP/${APP_NAME}.ipa"
          echo "ipa_path=$RUNNER_TEMP/${APP_NAME}.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
        id: package

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          retention-days: 30
          if-no-files-found: error

      - name: 输出摘要
        run: |
          echo "## 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**产物**：\`${{ steps.package.outputs.ipa_name }}.ipa\`（未签名）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在页面右上角 Artifacts 里下载，然后：" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Windows 装 [Sideloadly](https://sideloadly.io/)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. 拖入 ipa，填 Apple ID，点 Start" >> "$GITHUB_STEP_SUMMARY"
          echo "3. iPhone 上「设置 → 通用 → VPN与设备管理」信任证书" >> "$GITHUB_STEP_SUMMARY"
