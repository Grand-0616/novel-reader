name: Build iOS IPA

# 在 GitHub 的免费 macOS 机器上编译出未签名的 ipa。
# 下载后在你自己的 Windows 电脑上用 Sideloadly 签名安装。
#
# 触发方式：
#   1. 手动点 "Run workflow"
#   2. 或者 push 到 main 分支时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NovelReader/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          echo "当前可用 Xcode："
          ls /Applications | grep -i xcode || true
          # 用 16.2：稳定、对 SwiftData / Observation 支持完整，
          # 且不会像 16.3+ 那样强制要求模拟器运行时来跑 actool。
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          echo "--- 已安装的 iOS SDK ---"
          xcodebuild -showsdks | grep -i iphoneos || true
          echo "--- 模拟器运行时（可能为空，不影响真机构建）---"
          xcrun simctl list runtimes 2>/dev/null | head -20 || echo "无模拟器运行时"

      - name: 显示工程信息
        run: |
          # 仓库根目录就是工程目录（NovelReader.xcodeproj 与 NovelReader/ 源码目录同级）
          xcodebuild -project NovelReader.xcodeproj -list

      - name: 编译（不签名）
        run: |
          set -euo pipefail

          # ── 关于下面这些设置 ──
          #
          # CODE_SIGNING_ALLOWED=NO
          #   跳过所有签名步骤，产出未签名 .app，后面用 Sideloadly 在 Windows 上重签。
          #
          # ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES
          #   关键：GitHub Actions 的 macos runner 上没装 iOS 模拟器运行时，
          #   而 Xcode 16.2+ 的 actool 在编译 asset catalog 时会去找模拟器运行时
          #   来渲染图标，找不到就报：
          #     "No simulator runtime version ... available to use with iphonesimulator SDK"
          #   这个开关让 actool 跳过 App Store 相关的渲染步骤，直接用我们提供的 PNG。
          #
          # ENABLE_ON_DEMAND_RESOURCES=NO / DEBUG_INFORMATION_FORMAT
          #   减少无关产物，避免再踩 runner 环境的坑。
          xcodebuild build \
            -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            -quiet

          echo "编译成功"

      - name: 定位产物
        id: find_app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
                     -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到编译产物 .app"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" -type d || true
            exit 1
          fi
          echo "找到产物：$APP_PATH"
          echo "--- 内容 ---"
          ls -la "$APP_PATH" | head -30
          echo "--- 可执行文件架构 ---"
          file "$APP_PATH"/NovelReader 2>/dev/null || true
          lipo -info "$APP_PATH"/NovelReader 2>/dev/null || true
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$(basename "$APP_PATH" .app)" >> "$GITHUB_OUTPUT"

      - name: 打包成 ipa
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          APP_NAME="${{ steps.find_app.outputs.app_name }}"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          # 清掉可能残留的签名信息（Sideloadly 会重新签）
          rm -rf "$RUNNER_TEMP/ipa/Payload/$APP_NAME.app/_CodeSignature" || true

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/${APP_NAME}.ipa" Payload

          echo "ipa 大小："
          ls -lh "$RUNNER_TEMP/${APP_NAME}.ipa"
          echo "ipa_path=$RUNNER_TEMP/${APP_NAME}.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
        id: package

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          retention-days: 30
          if-no-files-found: error

      - name: 输出摘要
        run: |
          echo "## 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**产物**：\`${{ steps.package.outputs.ipa_name }}.ipa\`（未签名）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在页面右上角 Artifacts 里下载，然后：" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Windows 装 [Sideloadly](https://sideloadly.io/)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. 拖入 ipa，填 Apple ID，点 Start" >> "$GITHUB_STEP_SUMMARY"
          echo "3. iPhone 上「设置 → 通用 → VPN与设备管理」信任证书" >> "$GITHUB_STEP_SUMMARY"
